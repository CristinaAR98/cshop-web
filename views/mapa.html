<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa CSHOP - A Coruña</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      #map {
        width: 100%;
        height: 100%;
        min-height: 400px;
      }
    </style>
  </head>
  <body>
    <div id="map" role="region" aria-label="Mapa interactivo de CSHOP en Calle Compostela, 5, 15004 A Coruña"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      window.addEventListener("load", function () {
        const mapElement = document.getElementById("map");
        if (!mapElement || !window.L) return;

        const coordsCSHOP = [43.3688, -8.4068];
        const map = L.map("map", {
          center: coordsCSHOP,
          zoom: 15
        });

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markerCSHOP = L.marker(coordsCSHOP)
          .addTo(map)
          .bindPopup("<b>CSHOP</b><br>Calle Compostela, 5, 15004 A Coruña")
          .openPopup();

        setTimeout(function () {
          map.invalidateSize();
        }, 150);

        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const userCoords = [position.coords.latitude, position.coords.longitude];
              const markerUser = L.marker(userCoords)
                .addTo(map)
                .bindPopup("<b>Tu ubicación actual</b>");

              const bounds = L.latLngBounds([coordsCSHOP, userCoords]);
              map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
              markerCSHOP.closePopup();
              markerUser.openPopup();
            },
            function () {
              // Mantiene centrado en CSHOP si no se concede permiso
            }
          );
        }
      });
    </script>
  </body>
</html>
